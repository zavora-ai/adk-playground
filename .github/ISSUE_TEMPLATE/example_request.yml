name: "📝 Example Request"
description: Request a new playground example for ADK-Rust
title: "[Example Request]: "
labels: ["example-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new example! This helps us prioritize what to build next for the ADK-Rust Playground.

        Browse existing examples at [playground.adk-rust.com](https://playground.adk-rust.com) — 78 examples across 21 categories.

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which area does this example fall under?
      options:
        - Getting Started
        - Function Tools
        - Agents (LLM Agent, Multi-Agent, Agent-as-Tool)
        - Workflows (Sequential, Parallel, Loop)
        - Graph (Conditional, ReAct, Supervisor)
        - Sessions & State
        - Model Providers (OpenAI, Anthropic, Gemini, DeepSeek, xAI, Mistral, Bedrock, etc.)
        - Audio (TTS, Realtime Voice, Gemini Live)
        - Thinking / Reasoning (Chain-of-thought, Extended thinking)
        - Extensions (Skills, Plugins)
        - Coding (Sandbox, CLI)
        - RAG (Retrieval-Augmented Generation)
        - Security (Auth, RBAC, SSO, Audit)
        - Built-in Tools (Google Search, Web Search)
        - Payments (Checkout, Guardrails)
        - Action Nodes (SET, TRANSFORM, SWITCH)
        - Competitive (Encryption, Graph Resume, Tool Search)
        - Anthropic Features (Caching, Vision, Streaming)
        - v0.7+ Features (AWP, DeepSeek V4, Bounded Execution, Project Memory)
        - Callbacks & Guardrails
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What example would you like to see?
      description: Describe the example you'd like added to the playground.
      placeholder: |
        e.g. "An example showing how to use Claude's extended thinking with tool calls,
        where the agent reasons through a multi-step math problem and uses a calculator tool
        to verify its work."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why is this example useful? What would it help developers learn?
      placeholder: |
        e.g. "Many developers want to see how thinking/reasoning works alongside tool use.
        Current thinking examples don't combine both features."
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: Model provider (if applicable)
      description: Does this example require a specific provider?
      options:
        - Any / Not specific
        - Google (Gemini 3.1 Flash, Pro)
        - OpenAI (GPT-4.1, o4-mini, GPT-5)
        - Anthropic (Claude Sonnet 4, Haiku)
        - DeepSeek (V4 Flash, V4 Pro)
        - xAI (Grok-3, Grok-3-mini)
        - Mistral (Medium, Large, Small)
        - AWS Bedrock
        - Azure AI
        - OpenRouter
        - Ollama (Local)
        - Multiple providers
    validations:
      required: false

  - type: textarea
    id: code-sketch
    attributes:
      label: Code sketch (optional)
      description: If you have a rough idea of what the code should look like, paste it here.
      render: rust
    validations:
      required: false

  - type: checkboxes
    id: willing-to-contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to submit a PR for this example
          required: false
