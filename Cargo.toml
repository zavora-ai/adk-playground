[workspace]
resolver = "2"
members = [
]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
homepage = "https://www.zavora.ai"
repository = "https://github.com/zavora-ai/adk-playground"

[workspace.dependencies]
# External dependencies
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"

# ADK crates — published on crates.io
adk-core = "0.8.2"
adk-agent = "0.8.2"
adk-model = "0.8.2"
adk-tool = "0.8.2"
adk-runner = "0.8.2"
adk-server = "0.8.2"
adk-session = "0.8.2"
adk-artifact = "0.8.2"
adk-memory = "0.8.2"
adk-cli = "0.8.2"
adk-realtime = "0.8.2"
adk-graph = "0.8.2"
adk-browser = "0.8.2"
adk-eval = "0.8.2"
adk-ui = "0.8.2"
adk-telemetry = "0.8.2"
adk-guardrail = "0.8.2"
adk-auth = "0.8.2"
adk-plugin = "0.8.2"
adk-skill = "0.8.2"
adk-gemini = "0.8.2"
adk-code = "0.8.2"
adk-sandbox = "0.8.2"
adk-rag = "0.8.2"
adk-audio = "0.8.2"
adk-deploy = "0.8.2"
adk-rust = { version = "0.8.2", default-features = false, features = ["standard"] }

[profile.dev]
debug = 1
split-debuginfo = "packed"
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
strip = true
opt-level = 3
lto = true
