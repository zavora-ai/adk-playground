[package]
name = "acp-kiro-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-rust = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-acp = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
serde_json = "1.0"

[[bin]]
name = "acp-kiro-delegate"
path = "src/delegate.rs"

[[bin]]
name = "acp-kiro-direct"
path = "src/direct.rs"

[[bin]]
name = "acp-kiro-session"
path = "src/session.rs"

[[bin]]
name = "acp-kiro-env-cancel"
path = "src/env_and_cancel.rs"
