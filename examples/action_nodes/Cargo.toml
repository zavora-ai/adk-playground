[package]
name = "action-nodes-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-graph = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["action"] }
adk-action = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
http = ["adk-graph/action-http"]
full = ["http"]
