[package]
name = "agent-registry-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
# ADK crates (git dependencies on adk-rust, pinned to one commit)
adk-server = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["agent-registry"] }
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }

# HTTP client for calling the registry REST API
reqwest = { version = "0.12", features = ["json"] }

# Axum for hosting the registry server in-process
axum = "0.8"

# The demo RequestContextExtractor
async-trait = "0.1"

# Common dependencies
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
