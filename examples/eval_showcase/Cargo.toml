[package]
name = "eval-showcase"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-eval = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["embedding", "ci-helpers", "statistics"] }
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-memory = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["embedding-trait"] }
async-trait = "0.1"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
tempfile = "3"
