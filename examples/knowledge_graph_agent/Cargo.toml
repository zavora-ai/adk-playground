[package]
name = "knowledge-graph-agent"
version = "0.0.1"
edition = "2024"
publish = false
description = "An ordinary text LlmAgent with a bi-temporal knowledge-graph long-term memory: remember/relate to write, load_memory to recall, across sessions"

[workspace]

[dependencies]
# ADK crates (git dependencies on adk-rust, pinned to one commit)
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-agent = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-model = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["gemini"] }
adk-runner = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-memory = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["graph-memory"] }
adk-tool = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["graph-memory-tools"] }

# Runtime + helpers
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
dotenvy = "0.15"
