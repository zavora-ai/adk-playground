[package]
name = "line-inspector"
version = "0.0.1"
edition = "2024"
publish = false
description = "A quality agent over a candle line: every part scored on this computer against known-good parts with SigLIP 2, rejects segmented with SAM 2.1 and measured, borderline parts judged by two models, disagreements held for the engineer"

[workspace]

[dependencies]
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-artifact = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-devtools = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-harness = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["kernel", "vision"] }
adk-kernel = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-model = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", default-features = false, features = ["anthropic"] }
adk-runner = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-server = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-surface = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["web"] }
adk-vision = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["onnx", "cloud", "stream"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
