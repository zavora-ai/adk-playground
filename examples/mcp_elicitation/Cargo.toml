[package]
name = "mcp-elicitation-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "elicitation-server"
path = "src/server.rs"

[[bin]]
name = "elicitation-client"
path = "src/client.rs"

[dependencies]
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-rust = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["standard"] }
adk-tool = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["mcp"] }
adk-cli = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
rmcp = { version = "3.1", features = [
    "server", "client",
    "transport-io", "transport-child-process",
    "macros", "schemars", "elicitation",
] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
