[package]
name = "opencode-example"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-model = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", default-features = false, features = ["opencode"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
