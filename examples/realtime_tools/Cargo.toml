[package]
name = "realtime-tools-example"
version = "0.0.1"
edition = "2024"
publish = false
description = "Demonstrates tool calling in realtime voice sessions using IntegratedRealtimeRunner with session/memory persistence"

[workspace]

[dependencies]
# ADK crates
adk-realtime = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3", features = ["openai", "integration"] }
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }
adk-memory = { git = "https://github.com/zavora-ai/adk-rust", rev = "ca01dd8ec861f0d6b321a7c56857adea9cda25d3" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Error handling
anyhow = "1.0"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde_json = "1.0"

# TLS
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# UUID
uuid = { version = "1.23", features = ["v4"] }
