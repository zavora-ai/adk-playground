[package]
name = "vision-live-desk"
version = "0.0.1"
edition = "2024"
publish = false
description = "An agent that watches a desk through a USB camera: RF-DETR on the device, watch conditions that wake a kernel process, Claude describing through the egress gate, and held cards with the frame as evidence"

[workspace]

[dependencies]
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189" }
adk-artifact = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189" }
adk-devtools = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189" }
adk-harness = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189", features = ["kernel", "vision-local"] }
adk-kernel = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189", features = ["vision"] }
adk-model = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189", default-features = false, features = ["anthropic"] }
adk-runner = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189" }
adk-server = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189" }
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189" }
adk-surface = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189", features = ["web", "vision-camera"] }
adk-vision = { git = "https://github.com/zavora-ai/adk-rust", rev = "b526a163c4856f92375df09ee89040ececd42189", features = ["stream", "device", "track", "onnx", "cloud"] }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio-util = "0.7"
