[package]
name = "warehouse-watch"
version = "0.0.1"
edition = "2024"
publish = false
description = "A shift supervisor's agent over four warehouse cameras: people tracked on the device, forklifts spotted by Claude, near-misses measured in floor metres, reviewed over the clip with vision_video and held for sign-off"

[workspace]

[dependencies]
adk-core = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-artifact = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-devtools = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-harness = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["kernel", "vision"] }
adk-kernel = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["vision"] }
adk-model = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", default-features = false, features = ["anthropic"] }
adk-runner = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-server = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f" }
adk-surface = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["web", "vision-camera"] }
adk-vision = { git = "https://github.com/zavora-ai/adk-rust", rev = "98515241133d24f7e41f8fd272649035416a142f", features = ["stream", "ffmpeg", "track", "onnx", "cloud"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
